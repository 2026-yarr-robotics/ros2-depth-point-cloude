/**:
  ros__parameters:
    camera_frame: camera_color_optical_frame
    world_frame: world
    depth_unit: 0.001  # RealSense aligned_depth_to_color is uint16 mm
    # Floor-patch sampling (world_origin_node floor mode + point_cloud_node debug box)
    window_radius: 30
    window_center_x_px: 640
    window_center_y_px: 600

world_origin_node:
  ros__parameters:
    # ── Mode: aruco (default) | floor (legacy depth plane fit) ────────────
    world_origin_mode: aruco

    # ── ArUco mode ─────────────────────────────────────────────────────────
    color_topic: /camera/camera/color/image_raw
    world_marker_id: 0
    world_marker_dict: DICT_4X4_50        # 4x4 marker dict; only ID 0 used
    world_marker_length_m: 0.10           # marker side length (m) — MEASURE AND SET
    world_marker_samples_required: 30     # detection frames to average
    world_marker_reproj_err_max_px: 2.0   # solvePnP reprojection error limit (px)
    world_marker_timeout_s: 15.0          # fallback to floor after this many seconds
    aruco_timeout_then_floor: true

    # Marker position in the ROBOT BASE frame (metres, measured physically).
    world_marker_offset_x_m: 0.367
    world_marker_offset_y_m: 0.003
    world_marker_offset_z_m: 0.0         # height of marker surface in base frame

    # Marker frame orientation relative to BASE frame (Euler intrinsic XYZ, deg).
    # For a flat marker (normal = base +Z), only rot_z_deg matters — it rotates
    # the marker's pattern-top direction to align with base +Y in RViz.
    world_marker_rot_x_deg: 0.0
    world_marker_rot_y_deg: 0.0
    world_marker_rot_z_deg: -90.0

    # ── Hand-eye (handeye_aruco / view:=hand): reuse a fixed calibration ────
    # true  → publish the ee(link_6)→camera offset below DIRECTLY on startup
    #         and skip the live ArUco+FK calibration (no /tf-lag dependence).
    #         Re-calibrate on demand with the ~/redetect service.
    # false → auto-calibrate from ArUco on startup (legacy behaviour).
    # Values decomposed from the checkerboard hand-eye calibration matrix
    # T_gripper2camera.npy (fallen-cup-recovery/Calibration_Tutorial,
    # cv2.calibrateHandEye PARK; translation mm→m, rotation→Euler-XYZ same
    # convention as _euler_xyz_to_R). Previous live-ArUco values for reference:
    #   xyz [0.0087, 0.0765, 0.0281], rpy [-2.3, -4.2, -175.6]
    handeye_use_param_offset: true
    handeye_offset_xyz_m: [0.0286, 0.0602, 0.0106]
    handeye_offset_rpy_deg: [0.0, -0.1, -177.9]

    # ── Floor fallback params ──────────────────────────────────────────────
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    min_patch_points: 100
    max_plane_residual: 0.1
    samples_required: 10

detection_node:
  ros__parameters:
    # `model` = default / live-camera weight (digital_twin.launch.py and
    # digital_twin_with_robot.launch.py when no view-specific override is
    # passed).  Both exo and hand ship the same 2-class taxonomy now.
    model: /home/ssu/cup-stack-integration/vision/ros2-depth-point-cloude/vision/yolo/0610-2.pt
    # Per-view weights for digital_twin_sequence.launch.py (view:=exo|hand).
    model_exo: /home/ssu/cup-stack-integration/vision/ros2-depth-point-cloude/vision/yolo/0610-2.pt
    model_hand: /home/ssu/cup-stack-integration/vision/ros2-depth-point-cloude/vision/yolo/speedstack3class_yolo26s_seg_1280_epoch250_3class_lightaug_geom1_redp25_sm_a100_best.pt
    # Both models emit the same two classes:
    #   "fallen-cup"  (id=1)
    #   "upright-cup" (id=2)
    target_classes: ["fallen-cup", "upright-cup"]
    confidence: 0.35
    image_topic: /camera/camera/color/image_raw
    detections_topic: /digital_twin/detections
    debug_topic: /digital_twin/detection_debug
    device: "cuda:0"
    imgsz: 1280

point_cloud_node:
  ros__parameters:
    rgb_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    detections_topic: /digital_twin/detections
    points_topic: /digital_twin/points
    boxes_topic: /digital_twin/boxes
    # Namespaced so the integration aggregator_node sits in front of GSP.
    cups_on_table_topic: /vision/cups_on_table
    box_debug_topic: /digital_twin/box_debug
    downsample: 4
    z_min: 0.1
    z_max: 6.0     # raised from 4.0 — current exo mount sees cups @ ~4.2 m
    box_line_width: 0.0015
    box_alpha: 0.25
    box_standing_ratio: 0.8
    box_min_elongation: 1.5
    box_force_aabb: false
    mask_erode_px: 3
    depth_gradient_max_m: 0.06   # loosened: at ~4.2 m exo depth noise (~40-80mm)
    #                              tripped the old 15mm gate and dropped far cups
    box_outlier_mad_k: 3.0
    approx_sync_slop: 0.05
    track_world_merge_dist_m: 0.02  # world-frame re-association radius (m)

    # ----- Cup model (Speed Stack truncated cone, standing only) -----
    cup_top_diameter_m: 0.054
    cup_bottom_diameter_m: 0.078
    cup_height_m: 0.095
    cup_polygon_segments: 24
    cup_track_keepalive_frames: 5
    cup_fit_residual_max: 0.02

    # Classes that get the truncated-cone (Speed Stack standing cup) fit.
    # Anything NOT in this list falls through to _compute_box_world (OBB/AABB
    # from YOLO mask + depth, no shape prior) — the right model for fallen-cup
    # (axis no longer vertical, the cone fit can't represent it).
    #   "upright-cup"  → cone fit
    #   "fallen-cup"   → OBB fallback (intentionally absent)
    cup_class_names: ["upright-cup"]

    # ----- Rim/silhouette observations (depth-light measurement path) -----
    # Per-cup 2D silhouette chamfer fit (cup_geometry.fit_silhouette_xy):
    # mask contour + calibration constrain the axis (x,y) far better than the
    # depth cloud. Published on CupObservationArray ALONGSIDE the cloud path
    # (Phase 1 A/B; /digital_twin/boxes is unchanged).
    rim_obs_enabled: true
    rim_fit_period_s: 0.3        # min seconds between fits per track (~6ms/fit)
    rim_sigma_px: 2.0            # assumed contour 1σ (×3 moving, ×2 truncated)
    rim_min_iou: 0.2             # producer-side sanity gate (consumer: 0.5)
    rim_boundary_offset: true    # 3rd fit param b: uniform YOLO boundary bias
    #                              (px) absorbed instead of leaking into (x,y)
    rim_edge_snap: true          # re-anchor boundary to image-gradient peaks
    rim_edge_min_grad: 8.0       # min Sobel magnitude to accept an edge

    # ----- Accumulating-window pipeline -----
    window_period_s: 0.1

    # ----- Kalman position filter (replaces EMA + scan-and-lock) -----
    # Per-track constant-position KF on the cup/object centre. The estimate is
    # never frozen, so a slightly-wrong pose self-corrects over a few windows
    # (old LOCKED box stuck until the cup physically moved >3 cm).
    kf_process_std_xy_m: 0.002   # per-window drift the estimate may absorb (XY)
    kf_process_std_z_m: 0.004    # per-window drift (Z, depth is noisier)
    kf_meas_std_xy_m: 0.005      # assumed per-window fit error (XY)
    kf_meas_std_z_m: 0.010       # assumed per-window fit error (Z)
    kf_init_std_m: 0.05          # initial / re-acquire uncertainty (trust 1st meas)
    kf_gate_mahalanobis: 9.0     # χ²(3)≈97%; reject spikes beyond this. 0 disables
    kf_reacquire_windows: 3      # consecutive gated-out windows → relocation re-acquire
    kf_settled_std_m: 0.006      # position 1σ below this → "settled" ([S] tag)
    kf_resid_infl: 1.0           # inflate meas-noise by residual/cup_fit_residual_max

    # ----- ArUco marker axes overlay on box_debug -----
    aruco_overlay: true
    world_marker_length_m: 0.05         # must match world_origin_node value

    # ────────────────────────────────────────────────────────────────────────
    # === NOISE SUPPRESSION: Top-Rim + Spatial-Density Filtering ===
    # ────────────────────────────────────────────────────────────────────────
    # Top-rim: rendered cloud keeps only points within `top_rim_band_m` of the
    # cluster's `top_rim_percentile` height (isolates the cup rim). This only
    # affects the published /digital_twin/points cloud — the cone fit upstream
    # still uses ALL points. Increase the band to show more of the cup body;
    # set it ≤ 0 to keep the whole cluster.
    top_rim_band_m: 0.000       # keep top 8 mm below the rim (0 or less = off)
    top_rim_percentile: 95.0    # height percentile treated as "the top"

    # Spatial outlier rejection via local density (complementary to MAD).
    # Remove points with too few neighbors in `radius`.
    use_spatial_density_filter: true
    spatial_density_radius_m: 0.03    # neighborhood radius (30 mm)
    spatial_density_min_neighbors: 5  # min neighbor count in radius

    # ────────────────────────────────────────────────────────────────────────
    # === REALSENSE SDK HARDWARE PARAMETERS ===
    # ────────────────────────────────────────────────────────────────────────
    # (1) RealSense post-processing filters (enable via launch override)
    # These are activated in rs_align_depth_launch.py with:
    #   decimation_filter.enable:=true
    #   spatial_filter.enable:=true
    #   temporal_filter.enable:=true
    #   hole_filling_filter.enable:=true
    #
    # (2) Laser Power & Preset to reduce specular reflection noise
    visual_preset: High Accuracy      # or Hand-Held, Short-Range
    laser_power: 60                   # 0–100; lower = less reflection (default 80)
    # For plastic cups, lower laser_power (40–60) can reduce rim noise

cup_fusion_node:
  ros__parameters:
    # ── LIVE measurement source ──────────────────────────────────────────
    # rim (default): upright cups from silhouette observations (mask contour
    # + calibration; depth only picks the level). cloud = legacy point-cloud
    # cone fit (rollback). Fallen cups always use the cloud OBB.
    fit_source: rim
    rim_drop_moving: true        # discard hand obs captured mid-motion
    #                              (image-FK desync lands in the measurement)

    # ── Rim/silhouette observation path (Phase 1: parallel A/B) ──────────
    # Consumes the producers' silhouette fits, snaps z to the nesting
    # lattice, fuses cameras by inverse covariance and publishes
    # /digital_twin/boxes_rim_dbg (cyan frustums) + /digital_twin/fusion_health
    # (JSON incl. per-camera residuals = extrinsic health). The cloud path and
    # /digital_twin/boxes are untouched.
    rim_enabled: true
    table_z_m: 0.0               # table surface in world (= robot base) z
    nesting_offset_m: 0.020      # height ONE nested cup adds to a column —
    #                              MEASURE: stack 2 cups, total − cup_height_m
    rim_layer_height_m: 0.093    # pyramid slot lattice — MUST mirror the
    #                              server's PYRAMID_LAYER_HEIGHT (robot.py)
    rim_obs_max_age_s: 3.0       # obs cache lifetime (hand publishes ~0.5Hz;
    #                              1.0s silently aged its view out of fusion)
    rim_keepalive_s: 3.5         # rim-mode track eviction is WALL TIME (not
    #                              event count) — events fire at cloud rate
    #                              while obs refresh at 0.3-2s
    rim_level_hyst_m: 0.008      # level switch needs this much improvement
    rim_layer_pref_tol_m: 0.010  # pyramid preferred within real z_top noise
    #                              < |5*nest - layer| = 7mm (nest L5 vs pyr L1
    #                              nearly coincide — 0.007 misclassified them)
    rim_cluster_xy_m: 0.05       # cross-camera same-cup XY gate
    rim_min_iou: 0.5             # drop low-quality silhouette fits
    rim_max_rms_px: 6.0
    rim_log_dir: ""              # set to e.g. /tmp/rim_ab to record A/B CSV

    # ── Cross-camera extrinsic self-calibration ──────────────────────────
    # Shared cups calibrate the exo<->hand world disagreement (static ~30mm
    # = exo ArUco bias). apply=true corrects non-reference (exo) observations
    # by the EMA bias, so exo-only cups inherit hand-frame accuracy. Watch
    # the estimate in /digital_twin/fusion_health extrinsic_bias_mm.
    rim_bias_apply: true
    rim_bias_ref_cam: hand
    rim_bias_alpha: 0.05
    rim_bias_max_m: 0.08   # Isaac exo ArUco PnP bias ~55mm saturated 0.05
    # Doosan M0609 publishes joint states under the /dsr01 namespace
    # (global /joint_states has no publisher). scan-lock arrival
    # detection reads this; joint names already match joint_1..6.
    scan_joint_states_topic: /dsr01/joint_states
    # ── Scan & Lock (multi-view accumulate-at-waypoints) ──────────────────
    # Edit here and relaunch (no rebuild — params.yaml is symlink-installed).
    # Waypoints: a FLAT list of 6 joint angles (deg) per waypoint, concatenated.
    # The arm visits each in order; arrival is auto-detected by joint match.
    # Default below = a SINGLE waypoint (pos1). Append 6 more values to add a
    # 2nd waypoint, etc.  ← set this to the robot's new scan pose.
    scan_waypoints_deg: [103.4671, -4.3731, 100.2539, -29.3674, 115.5776, -139.6331]
    scan_capture_s: 1.0          # HAND depth accumulation time per waypoint (s)
    scan_wait_s: 1.0             # settle wait after arrival before capturing (s)
    scan_arrival_tol_rad: 0.02   # per-joint arrival gate (~1.15°)
    # Live hand-view toggle (Tk "Use hand (live)" checkbox). false (default)
    # = live fit is EXO ONLY; hand observations show in the panel (H-cloud/
    # H-box) but never enter the fit or RViz. Scan-frozen hand observations
    # ([S]) always participate regardless.
    live_use_hand: false

    # ── Live noise suppression ────────────────────────────────────────────
    # (A) Temporal frame accumulation: union each camera's clouds over this
    # window before fitting → averages out raw per-frame depth noise (far exo
    # ±40-80mm, zero-mean → cancels). 0 = latest cloud only. Keep short so a
    # moving cup doesn't smear (static cups on a table benefit most).
    fusion_accum_window_s: 0.15
    # (B) Spatial-density filter: drop isolated noise islands / flying-pixels
    # (a point with < min_neighbors others within radius) from the fit input.
    use_fusion_density_filter: true
    fusion_density_radius_m: 0.03
    fusion_density_min_neighbors: 4

    # ── Premerge: cup-cylinder containment (replaces 3D AABB-IoU) ──────────
    # Two UPRIGHT detections = same cup iff their XY box-centers are within
    # cup_axis_xy_m AND the union z-span <= cup_height*(1+cup_span_margin).
    # Merges a hand top-rim disc with an exo side slab (they share the axis);
    # splits vertically-stacked cups (union z-span > one cup). Fallen cups fall
    # back to the legacy IoU gate (premerge_iou/dxy/dz above). Margin must sit
    # between one cup (0.095) and cup+min-layer-spacing (~0.134): 0.119 ✓.
    cup_axis_xy_m: 0.06       # ~cup radius (0.039) + slack
    cup_span_margin: 0.25
